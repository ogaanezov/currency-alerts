services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: currency_alerts
      POSTGRES_USER: currency_alerts
      # Пароль только для локальной разработки, в продакшене так не делают.
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
