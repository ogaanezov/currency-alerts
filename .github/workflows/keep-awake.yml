name: Keep site awake

# Бесплатный Render усыпляет сайт после 15 минут без посетителей.
# Заходим на /health каждые 10 минут, чтобы сайт не засыпал и курсы собирались раз в час.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 https://currency-alerts.onrender.com/health
