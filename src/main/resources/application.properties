spring.application.name=currency-alerts
# Хостинг (Render) сам задаёт порт в переменной PORT, локально — 8080.
server.port=${PORT:8080}

# Локальная база из compose.yaml
spring.datasource.url=jdbc:postgresql://localhost:5432/currency_alerts
spring.datasource.username=currency_alerts
spring.datasource.password=local-dev-password

# Open Exchange Rates. Ключ берётся из переменной окружения OXR_APP_ID.
oxr.base-url=https://openexchangerates.org/api
oxr.app-id=${OXR_APP_ID:}
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

# Ключ владельца: без него менять правила нельзя. Пустой — менять может любой (для разработки).
app.admin-token=${ADMIN_TOKEN:}

# Сбор курсов по расписанию
rates.currencies=EUR,GBP,AMD,GEL,RUB
rates.collection.enabled=true
rates.collection.interval=PT1H

# Страница интерфейса: браузер не должен показывать старую версию из кеша после обновления.
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.use-last-modified=false
