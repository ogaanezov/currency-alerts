spring.application.name=currency-alerts

# Локальная база из compose.yaml
spring.datasource.url=jdbc:postgresql://localhost:5432/currency_alerts
spring.datasource.username=currency_alerts
spring.datasource.password=local-dev-password

# Open Exchange Rates. Ключ берётся из переменной окружения OXR_APP_ID.
oxr.base-url=https://openexchangerates.org/api
oxr.app-id=${OXR_APP_ID:}
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s
